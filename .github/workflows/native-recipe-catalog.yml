name: Generate Native Recipe Catalogs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up published Pantry and managed workspace tools
        uses: ./packages/action
        with:
          version: 0.11.91
      - name: Install first-party JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Verify registration invariants
        run: bun test packages/ts-pantry/test/native-ci-metadata.test.ts packages/ts-pantry/test/native-ci-tools-recipe.test.ts
      - name: Generate native package metadata and both installer catalogs
        run: |
          set -e
          bun .github/scripts/register-native-ci-packages.ts
          bun packages/ts-pantry/scripts/sync-recipe-dependencies.ts mysql.com mesa3d.org invisible-island.net/ncurses sourceforge.net/e2fsprogs php.net getcomposer.org gnu.org/autoconf gnu.org/automake gnu.org/libtool cmake.org google.com/chrome gnutls.org freedesktop.org/p11-kit
          git add -N packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig
          git diff --check -- packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig
          git diff --binary -- packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig > artifacts/native-catalog/catalogs.patch
          git rev-parse HEAD > artifacts/native-catalog/source-commit.txt
      - name: Retain the generated source patch and registration evidence
        uses: actions/upload-artifact@v4
        with:
          name: native-recipe-catalog
          path: artifacts/native-catalog
          if-no-files-found: error
