name: Generate Native Recipe Catalogs
on:
  workflow_dispatch:
    inputs:
      verify-dynamodb:
        description: Build the immutable DynamoDB Local recipe and require its live database health check
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up published Pantry and managed workspace tools
        uses: ./packages/action
        with:
          version: 0.11.93
          install: 'false'
          packages: bun.com@1.4.3
      - name: Install first-party JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Record the exact source and runtime before recipe validation
        run: |
          mkdir -p artifacts/native-catalog
          git rev-parse HEAD > artifacts/native-catalog/source-commit.txt
          bun --version > artifacts/native-catalog/bun-version.txt
      - name: Verify registration invariants
        run: |
          set -o pipefail
          bun test packages/ts-pantry/test/native-ci-metadata.test.ts packages/ts-pantry/test/native-ci-tools-recipe.test.ts packages/ts-pantry/test/dynamodb-local-recipe.test.ts packages/ts-pantry/test/generated-package-docs.test.ts packages/ts-pantry/test/fetch.test.ts packages/action/src/services.test.ts packages/ts-pantry/test/resolve-build-version.test.ts 2>&1 | tee artifacts/native-catalog/recipe-tests.log
      - name: Verify locked tool selection against the installer contract
        run: bun test packages/action/src/lock-version.test.ts
      - name: Typecheck the normal Pantry source
        run: bun run typecheck
      - name: Lint package documentation generation
        run: bunx --bun pickier run --mode lint packages/ts-pantry/src/fetch.ts packages/ts-pantry/test/generated-package-docs.test.ts packages/ts-pantry/scripts/resolve-build-version.ts packages/ts-pantry/test/resolve-build-version.test.ts packages/action/src/services.ts packages/action/src/services.test.ts
      - name: Lint the native DynamoDB provider and build assets
        if: inputs.verify-dynamodb
        run: bunx --bun pickier run --mode lint packages/ts-pantry/scripts/maven-versions.ts packages/ts-pantry/scripts/copy-recipe-props.ts packages/ts-pantry/src/recipes/aws.amazon.com/dynamodb-local.ts packages/ts-pantry/src/recipes/props/aws.amazon.com/dynamodb-local/health.ts packages/ts-pantry/test/dynamodb-local-recipe.test.ts
      - name: Generate native package metadata and both installer catalogs
        run: |
          set -e
          bun .github/scripts/register-native-ci-packages.ts
          bun packages/ts-pantry/scripts/sync-recipe-dependencies.ts mysql.com mesa3d.org invisible-island.net/ncurses sourceforge.net/e2fsprogs php.net getcomposer.org gnu.org/autoconf gnu.org/automake gnu.org/libtool cmake.org google.com/chrome gnutls.org freedesktop.org/p11-kit tukaani.org/xz openjdk.org aws.amazon.com/dynamodb-local
          git add -N packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig
          git diff --check -- packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig
          git diff --binary -- packages/ts-pantry/src/packages packages/zig/src/packages/generated.zig > artifacts/native-catalog/catalogs.patch
          git rev-parse HEAD > artifacts/native-catalog/source-commit.txt
      - name: Produce the normal Action bundles from verified source
        run: |
          bun run --cwd packages/action build
          mkdir -p artifacts/native-catalog/action
          cp packages/action/dist/index.js packages/action/dist/post.js artifacts/native-catalog/action/
          git rev-parse HEAD > artifacts/native-catalog/action/source-commit.txt
      - name: Verify that a stale development lock cannot replace the stable compiler
        uses: ./packages/action
        with:
          version: 0.11.93
          install: 'false'
          packages: ziglang.org@0.17.0 bun.com@1.4.3
      - name: Verify the actual managed compiler identity
        run: |
          test "$(zig --version)" = 0.17.0
          case "$(command -v zig)" in "$GITHUB_WORKSPACE"/pantry/*) ;; *) exit 1 ;; esac
          zig --version > artifacts/native-catalog/zig-version.txt
      - name: Build the native DynamoDB distribution and require its live health check
        if: inputs.verify-dynamodb
        env:
          PANTRY_REPORTED_BY_PARENT: '1'
          STORAGE_PROVIDER: ${{ vars.STORAGE_PROVIDER || 'aws' }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'pantry-registry' }}
          S3_REGION: ${{ vars.S3_REGION || 'us-east-1' }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -o pipefail
          bun packages/ts-pantry/scripts/build-package.ts --package aws.amazon.com/dynamodb-local --version 3.3.0 --platform linux-x86-64 --build-dir "$RUNNER_TEMP/dynamodb-build" --prefix "$RUNNER_TEMP/dynamodb-install" --deps-dir "$RUNNER_TEMP/dynamodb-deps" --bucket "$S3_BUCKET" --region "$S3_REGION" 2>&1 | tee artifacts/native-catalog/native-build.log
      - name: Retain the generated source patch and registration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-recipe-catalog
          path: artifacts/native-catalog
          if-no-files-found: error
