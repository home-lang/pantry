name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Default to least-privilege GITHUB_TOKEN; jobs that need more elevate explicitly.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install Dependencies
        id: install
        run: bun install

      # These three check different things and do not depend on each other, so
      # every one of them runs even when an earlier one fails. As plain
      # sequential steps the first red step skipped the rest, which is why the
      # Zig formatting below went unreported for as long as the TypeScript lint
      # above it was failing.
      - name: Lint TypeScript/JavaScript
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Check package-manager and registry documentation contracts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run docs:contracts:check

      # Zig is a hard dependency of this repo, so a missing toolchain is a
      # failure rather than a reason to quietly pass. The old `if command -v
      # zig` guard turned "pantry could not install zig" into a silent skip.
      - name: Format Check Zig Code
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          command -v zig >/dev/null || { echo "::error::zig not on PATH — cannot verify formatting"; exit 1; }
          find packages/zig/src -name "*.zig" -not -name "generated.zig" -type f -exec zig fmt --check {} +

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install Dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    # Source CLI and Bun checks share their prepared compiler. The independent
    # Zig suite below must not spend its budget downloading Android tools.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install Dependencies
        id: install
        run: bun install

      - name: Build TypeScript packages
        id: build
        run: bun run build

      - name: Build pantry GitHub Action
        id: build_action
        run: cd packages/action && bun run build

      # The source CLI build prepares the pinned compiler before the Bun
      # incremental-metadata test. That regression keeps its short rebuild
      # budget; a cold compiler bootstrap is setup rather than a cache check.
      - name: Test the source CLI workspace lifecycle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          command -v zig >/dev/null
          cd packages/zig
          zig build -Doptimize=Debug -j2
          PANTRY_SOURCE_CLI="$PWD/zig-out/bin/pantry" bun test test/workspace-companion-e2e.test.ts

      - name: Verify Git installation with the source Linux CLI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PANTRY_TEST_CLI: packages/zig/zig-out/bin/pantry
        run: bun .github/scripts/linux-native-tools.ts

      - name: Verify Android tools installation with the source Linux CLI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PANTRY_TEST_CLI: packages/zig/zig-out/bin/pantry
        run: bun .github/scripts/android-native-tools.ts

      - name: Retain source Android tools verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-android-native-tools
          path: artifacts/android-native-tools
          if-no-files-found: error

      - name: Retain source Linux CLI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-linux-native-tools
          path: artifacts/linux-native-tools
          if-no-files-found: error

      - name: Install native runtime fixture tools through Pantry
        uses: ./packages/action
        with:
          install: 'false'
          packages: nixos.org/patchelf@0.18.0 llvm.org@23.1.3 gnu.org/binutils@2.46.0

      - name: Verify the managed package-build compiler
        run: |
          set -e
          case "$(command -v clang)" in "$GITHUB_WORKSPACE"/pantry/*) ;; *) exit 1 ;; esac
          clang --version | head -1 | grep -F '23.1.3'

      # Report Bun and Zig independently even when either suite fails.
      - name: Verify registry test storage is released
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build_action.outcome == 'success' }}
        run: |
          fixture_tmp="$(mktemp -d)"
          trap 'rm -rf -- "$fixture_tmp"' EXIT
          TMPDIR="$fixture_tmp" bun test ./packages/registry/src/tiers.test.ts
          leaked_fixture="$(find "$fixture_tmp" -type d -name 'pantry-registry-*' -print -quit)"
          if [ -n "$leaked_fixture" ]; then
            printf '::error::Registry tests retained owned storage: %s\n' "$leaked_fixture"
            exit 1
          fi

      - name: Unit Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.build_action.outcome == 'success' }}
        env:
          PANTRY_TEST_CC: '["clang"]'
        run: bun test

  zig-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup pinned Pantry and workspace dependencies
        uses: ./packages/action
        with:
          version: '0.11.93'

      - name: Install first-party JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Install native runtime fixture tools through Pantry
        uses: ./packages/action
        with:
          version: '0.11.93'
          install: 'false'
          packages: nixos.org/patchelf@0.18.0 llvm.org@23.1.3 gnu.org/binutils@2.46.0

      - name: Verify the managed package-build compiler
        run: |
          set -e
          case "$(command -v clang)" in "$GITHUB_WORKSPACE"/pantry/*) ;; *) exit 1 ;; esac
          clang --version | head -1 | grep -F '23.1.3'

      - name: Zig Tests
        run: |
          command -v zig >/dev/null
          cd packages/zig
          zig build test -j2 --summary all

  action-redis-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry and pinned Redis
        id: pantry
        uses: ./packages/action
        with:
          install: 'false'
          services: redis@8.8.0

      - name: Verify exported runtime and live service contract
        env:
          ACTION_REDIS_URL: ${{ steps.pantry.outputs.redis-url }}
          ACTION_REDIS_VERSION: ${{ steps.pantry.outputs.redis-version }}
        run: |
          test "$REDIS_HOST" = 127.0.0.1
          test "$REDIS_PORT" -ne 6379
          test -n "$REDIS_PASSWORD"
          test -n "$REDIS_URL"
          test "$ACTION_REDIS_URL" = "$REDIS_URL"
          test "$ACTION_REDIS_VERSION" = "8.8.0"
          test "$REDIS_SERVICE_VERSION" = "$ACTION_REDIS_VERSION"
          bun --version
          test "$(redis-cli -u "$REDIS_URL" ping)" = "PONG"
          redis-cli -u "$REDIS_URL" set pantry-action-contract ready
          test "$(redis-cli -u "$REDIS_URL" get pantry-action-contract)" = "ready"

  action-native-services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mysql: ['26.7.0', '8.4.11']
    steps:
      - uses: actions/checkout@v6
      - name: Set up native MySQL, PostgreSQL, Redis and Typesense through Pantry
        id: pantry
        uses: ./packages/action
        with:
          install: 'false'
          version: 0.11.91
          packages: bun.sh@1.4.2
          services: postgres@17.11 mysql@${{ matrix.mysql }} typesense@30.2 redis@8.8.0
      - name: Verify authenticated PostgreSQL and action exports
        env:
          ACTION_MYSQL_URL: ${{ steps.pantry.outputs.mysql-url }}
          ACTION_MYSQL_VERSION: ${{ steps.pantry.outputs.mysql-version }}
        run: |
          test "$POSTGRES_SERVICE_VERSION" = 17.11
          test "$(psql -X -A -t -c 'SELECT 42')" = 42
          test "$TYPESENSE_SERVICE_VERSION" = 30.2
          test "$MYSQL_SERVICE_VERSION" = "${{ matrix.mysql }}"
          test "$ACTION_MYSQL_VERSION" = "$MYSQL_SERVICE_VERSION"
          test "$ACTION_MYSQL_URL" = "$MYSQL_URL"
          test "$MYSQL_HOST" = 127.0.0.1
          test "$MYSQL_PORT" -ne 3306
      - name: Verify native isolation, indexing and cleanup
        env:
          PANTRY_NATIVE_SERVICE_TEST_BIN: ${{ github.workspace }}/pantry/.bin
          PANTRY_NATIVE_MYSQL_TEST_VERSION: ${{ matrix.mysql }}
        run: |
          test -x "$PANTRY_NATIVE_SERVICE_TEST_BIN/mysqld"
          test -x "$PANTRY_NATIVE_SERVICE_TEST_BIN/redis-server"
          bun test packages/action/src/native-services.integration.test.ts packages/action/src/services.test.ts

  action-native-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install native tool dependency graphs through Pantry
        uses: ./packages/action
        with:
          install: 'false'
          packages: bun.sh@1.4.2 git-scm.org@2.53.0 openssh.com@10.2.0
      - name: Exercise executable wrappers and native compression libraries
        run: |
          test "$(git --version)" = 'git version 2.53.0'
          git init "$RUNNER_TEMP/pantry-git-contract"
          test -z "$(git -C "$RUNNER_TEMP/pantry-git-contract" status --porcelain)"
          printf 'Pantry native compression contract\n' > "$RUNNER_TEMP/pantry-compression-input"
          zstdmt -q -f "$RUNNER_TEMP/pantry-compression-input" -o "$RUNNER_TEMP/pantry-compression-input.zst"
          zstd -q -d -f "$RUNNER_TEMP/pantry-compression-input.zst" -o "$RUNNER_TEMP/pantry-compression-output"
          cmp "$RUNNER_TEMP/pantry-compression-input" "$RUNNER_TEMP/pantry-compression-output"
      - name: Verify relocated native SSH clients
        env:
          PANTRY_NATIVE_OPENSSH_TEST_BIN: ${{ github.workspace }}/pantry/.bin
        run: bun test packages/action/src/native-openssh.integration.test.ts

  continuous-release:
    needs: [lint, typecheck, test, action-redis-service, action-native-services, action-native-tools]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Best-effort commit-preview publishing. Don't fail the whole workflow
    # if the registry/S3 is unreachable or secrets are missing — the main
    # pipeline (typecheck/lint/test) is what gates mergeability.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: ./packages/action

      - name: Install Dependencies
        run: bun install

      - name: Build TypeScript packages
        run: bun run build

      - name: Continuous Releases
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
          PANTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
        run: |
          # Revert any accidental changes to bun.lock from `bun install` during setup
          if [ -f bun.lock ] && ! git diff --quiet bun.lock; then
            git checkout -- bun.lock
          fi
          pantry publish:commit './packages/*'

  notify:
    name: discord-failure-alert
    needs: [lint, typecheck, test, action-redis-service, continuous-release]
    # continuous-release is best-effort; only alert on gating job failures.
    if: always() && (needs.lint.result == 'failure' || needs.typecheck.result == 'failure' || needs.test.result == 'failure' || needs.action-redis-service.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/discord-notify
        with:
          title: "CI — Failed"
          description: "CI pipeline failure on ${{ github.ref_name }}"
          status: failure
          fields: |
            [
              {"name": "Lint", "value": "${{ needs.lint.result }}", "inline": true},
              {"name": "Typecheck", "value": "${{ needs.typecheck.result }}", "inline": true},
              {"name": "Test", "value": "${{ needs.test.result }}", "inline": true},
              {"name": "Redis service", "value": "${{ needs.action-redis-service.result }}", "inline": true},
              {"name": "Release", "value": "${{ needs.continuous-release.result }}", "inline": true},
              {"name": "Branch", "value": "${{ github.ref_name }}", "inline": true},
              {"name": "Author", "value": "${{ github.actor }}", "inline": true}
            ]
          webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
